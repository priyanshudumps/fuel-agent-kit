[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuel-agent-kit"
version = "0.1.0"
description = "An AI agent for the Fuel blockchain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dhai", email = "dhaiwatpandya@gmail.com" },
]
keywords = ["fuel", "agent", "blockchain", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/dhaiwat10/fuel-agent-kit"
Repository = "https://github.com/dhaiwat10/fuel-agent-kit"
